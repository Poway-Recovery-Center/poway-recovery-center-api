<!-- Custom file for standardizing Project Data
This HTML is setup as as a Jinja2 layout, coders use layouts for:
 ... standardization of style
 ... setting expectations for data
 ... code reuse
-->
<!DOCTYPE HTML>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <!-- JQuery -->
    <script type="text/javascript" language="javascript" src="https://code.jquery.com/jquery-3.5.1.js"></script>
    <script type="text/javascript" language="javascript" src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script type="text/javascript" language="javascript" src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>

    <style>
        .navbar {
            position: static;
            z-index: 9999;
        }
        #body_background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
    </style>

    <title>Open Coding | {% block title %}{% endblock %} </title>

</head>

<body>
    <div id="body_background"></div>

    <!-- Navigation Bar from bootstrap
This HTML is setup as a fragment allowing it to be "included" by other HTML files via Jinja2
-->
    <nav class="navbar navbar-expand-lg navbar-light bg-secondary">
        <div class="container-fluid">
            <div class="btn-group">
                <img src="{{ url_for('static', filename='assets/ncs_logo.png') }}" width="50" height="50" class="d-inline-block align-center" alt="">
                <a class="navbar-brand" href="https://csp.nighthawkcodingsociety.com/">Open Coding</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="navbar-nav">
                    <!-- url_for is a Jinja2 pre-processor that finds route from function name (def) -->
                    <a class="nav-link" href={{ url_for('index') }}>Home</a>
                    <div class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDarkDropdownMenuLink" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                          Data
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="navbarDarkDropdownMenuLink">
                            <li><a class="dropdown-item" href={{ url_for('admin.utable') }}>User Management</a></li>
                            <li><a class="dropdown-item" href={{ url_for('admin.meetings') }}>Meetings</a></li>
                            <li><a class="dropdown-item" href={{ url_for('admin.contacts') }}>Contact Messages</a></li>
                        </ul>
                    </div>
                </div>

            </div>

            <div class="btn-group">
                <!-- Search Box -->
                <div class="px-3" style="height:30px;">
                    <input id="search" type="search" placeholder="Search" aria-label="Search">
                </div>
                {% if current_user %}
                    <a href="{{ url_for('admin.logout') }}" class="px-3 link-dark">Logout ({{ current_user.uid }})</a>
                {% else %}
                    <a href="{{ url_for('admin.login') }}" class="px-3 link-dark">Login</a>
                {% endif %}

                <!-- Dark mode action -->
                <div class="form-check form-switch">
                    <label class="custom-control-label" for="darkSwitch"></label>
                    <input type="checkbox" onclick="darkFunction()" class="form-check-input link-dark" id="darkSwitch">
                </div>
            </div>

            <!-- Navigation bar JavaScript support -->
            <script>
                const search = document.getElementById('search');
                const google = 'https://www.google.com/search?q=site%3A+';
                const site = 'https://nighthawkcodingsociety.com';

                function submitted(event) {
                    if (event.key === 'Enter') {
                        // calculations to determine new window size at 66% of existing
                        const reduction = 0.66;  // reduce by 66%
                        const w = Math.trunc(window.innerWidth*reduction);
                        const h = Math.trunc(window.outerHeight*reduction);
                        const l = Math.trunc(window.top.screenX + ((window.innerWidth - w)/2));
                        const t = Math.trunc(window.top.screenY + ((window.outerHeight - h)/2));
                        const left = "left=" + l;
                        const top = "top=" + t;
                        const width = "width=" + w;
                        const height = "height=" + h;
                        const location = left + ", " + top + ", " + width + ", " + height

                        // setup and display window
                        event.preventDefault();
                        const url = google
                            + site
                            + '+'
                            + search.value;
                        const win = window.open(url, "CompSci A Search", location);
                        win.focus();
                    }
                }
                search.addEventListener('keypress', submitted);

                // Dark Mode Control
                // darkSwitch global element is set for convenience
                const darkSwitch=document.getElementById("darkSwitch");
                // establishes the initial state of darkSwitch on page load
                if(darkSwitch) {
                    // obtains the value of darkSwitch from localStorage
                    const darkSwitchSelected =
                        localStorage.getItem("darkSwitch") !== null &&
                        localStorage.getItem("darkSwitch") === "dark";
                    // sets the value of darkSwitch.checked to the global darkSwitch
                    darkSwitch.checked=darkSwitchSelected;
                    // if dark-mode, toggle the switch to dark-mode position
                    if (darkSwitchSelected)
                        document.body.classList.toggle("dark-mode");
                }
                // executes on each "dark mode" UI toggle
                function darkFunction() {
                    // toggles between off (standard CSS) and dark-mode (.dark-mode CSS)
                    document.body.classList.toggle("dark-mode");
                    // localStorage is used to manage darkSwitch status
                    darkSwitch.checked
                        ? localStorage.setItem("darkSwitch","dark")
                        : localStorage.removeItem("darkSwitch");
                }
                // End Dark Mode Control

            </script>

        </div>
    </nav>

    <!-- Start of body content specific to page -->
    {% block body %}{% endblock %}

</body>

    <script src="{{ url_for('static', filename='js/three.r119.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vanta.birds.min.js') }}"></script>
    <script>
        VANTA.BIRDS({
            el: "#body_background",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00
        })
    </script>
    {% block script %}{% endblock %}

</html>
